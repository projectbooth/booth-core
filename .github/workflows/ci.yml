name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests, no
# cluster needed. Runs on every push and PR; branch protection on main requires this
# to pass before merge.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Unit + contract tests
        # test/integration is excluded here: it needs envtest's kube-apiserver/etcd
        # binaries and belongs to the layer-3 workflow (integration.yml), not this
        # fast, cluster-free layer.
        run: go test -race -count=1 $(go list ./... | grep -v /test/integration)

      - name: scripts/booth-admin unit tests
        # Pure stdlib, no real Keycloak -- scripts/testdata/test_booth_admin.py fakes every
        # Admin REST API call. The real-Keycloak end-to-end coverage is integration.yml's
        # booth-admin-check job; this is the fast, cluster-free layer for the pieces that
        # don't need one (set-password, harden-master).
        run: python3 scripts/testdata/test_booth_admin.py -v

      - name: prune-s3-backups.sh unit tests (ADR 0109 amendment 2, count-based S3 retention)
        # No Postgres and no real bucket needed to test the prune logic itself -- runs the real
        # script against test/scripts/fake-aws.sh and a local directory fixture. Covers fewer
        # than retention, exactly retention, more than retention, a non-timestamp prefix (must
        # survive), an empty bucket, a bad RETENTION value, and a failed upload or a failed
        # prune (neither may touch the newly uploaded backup).
        run: sh test/scripts/prune-s3-backups_test.sh

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm dependency update
        working-directory: charts/booth-core
        run: helm dependency update

      - name: helm lint
        working-directory: charts/booth-core
        run: |
          helm lint . \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-core \
            --set iframeSigningKey=ci-placeholder \
            --set keycloak.enabled=false

      - name: helm template (render check)
        working-directory: charts/booth-core
        run: |
          helm template booth-core . \
            --namespace booth-system \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-core \
            --set iframeSigningKey=ci-placeholder \
            --set keycloak.enabled=false \
            --include-crds > /dev/null

      - name: helm template (render check, the bundled default)
        working-directory: charts/booth-core
        run: |
          helm template booth-core . \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --include-crds > /dev/null

      - name: helm template (ingress.shell.enabled true/false, ADR 0112)
        # "/" must route to the shell's Service by default, and fall back to core's own Service
        # when the operator turns shell routing off -- a regression here silently breaks every
        # browser login (ADR 0112's root cause) without failing lint or any other render check.
        working-directory: charts/booth-core
        run: |
          helm template booth-core . \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --show-only templates/ingress.yaml > /tmp/ingress-shell-enabled.yaml
          grep -A4 'path: /$' /tmp/ingress-shell-enabled.yaml | grep -q 'name: booth-design' \
            || { echo "ingress.shell.enabled=true (default): '/' did not route to booth-design"; cat /tmp/ingress-shell-enabled.yaml; exit 1; }

          helm template booth-core . \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --set ingress.shell.enabled=false \
            --show-only templates/ingress.yaml > /tmp/ingress-shell-disabled.yaml
          grep -A4 'path: /$' /tmp/ingress-shell-disabled.yaml | grep -q 'name: booth-core$' \
            || { echo "ingress.shell.enabled=false: '/' did not fall back to core's own Service"; cat /tmp/ingress-shell-disabled.yaml; exit 1; }

      - name: helm template (coreUrl is derived from release/namespace, ADR 0113 amendment 1)
        # BOOTH_CORE_URL must never be the literal "booth-core.booth-system" -- it has to track
        # whatever release name and namespace this install actually uses, or a module annotated
        # to receive coreUrl would get a wrong, unreachable address the moment core is installed
        # under a different name (a second environment, a renamed release, a non-default
        # namespace). Rendering with both non-default here is what actually proves that, not
        # just that the helper exists.
        working-directory: charts/booth-core
        run: |
          helm template my-core-release . \
            --namespace my-core-namespace \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --show-only templates/deployment.yaml > /tmp/coreurl-rendered.yaml
          grep -A1 'name: BOOTH_CORE_URL' /tmp/coreurl-rendered.yaml | grep -q 'value: "http://my-core-release-booth-core.my-core-namespace.svc.cluster.local:8080"' \
            || { echo "BOOTH_CORE_URL was not derived from the release name and namespace"; cat /tmp/coreurl-rendered.yaml; exit 1; }

      - name: helm template (backup CronJob waits for Postgres, ARCHITECTURE.md item 66)
        # A Job retry is a brand-new pod with a new IP, so it meets the bundled PostgreSQL's
        # few-second first-connection refusal window just like the attempt before it did --
        # the daily backup had never once succeeded on the homelab until this wait was added.
        # Renders the ConfigMap holding files/pg-backup.sh (both the pvc and s3 CronJob
        # variants mount this same script) and checks the wait loop is actually in it.
        working-directory: charts/booth-core
        run: |
          helm template booth-core . \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --show-only templates/postgresql-backup.yaml > /tmp/backup-rendered.yaml
          grep -q 'pg_isready' /tmp/backup-rendered.yaml \
            || { echo "rendered backup script has no pg_isready wait loop"; cat /tmp/backup-rendered.yaml; exit 1; }
          grep -q 'WAIT_SECONDS' /tmp/backup-rendered.yaml \
            || { echo "rendered backup script has no bounded wait"; cat /tmp/backup-rendered.yaml; exit 1; }

      - name: helm template (S3 backup retention is a count, ADR 0109 amendment 2)
        # A rendered chart missing the RETENTION env var, or the call to prune-s3-backups.sh, or
        # that script's own integer guard, would silently ship with no pruning at all, or with
        # pruning that accepts a bad RETENTION value instead of refusing it.
        working-directory: charts/booth-core
        run: |
          helm template booth-core . \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --set postgresql.backup.s3.bucket=ci-bucket \
            --set postgresql.backup.s3.existingSecret=ci-s3-secret \
            --show-only templates/postgresql-backup.yaml > /tmp/backup-s3-rendered.yaml
          grep -q 'name: RETENTION' /tmp/backup-s3-rendered.yaml \
            || { echo "rendered S3 upload container has no RETENTION env var"; cat /tmp/backup-s3-rendered.yaml; exit 1; }
          grep -q 'prune-s3-backups.sh' /tmp/backup-s3-rendered.yaml \
            || { echo "rendered S3 upload container never calls prune-s3-backups.sh"; cat /tmp/backup-s3-rendered.yaml; exit 1; }
          grep -q 'RETENTION must be an integer' /tmp/backup-s3-rendered.yaml \
            || { echo "rendered prune script has no RETENTION guard"; cat /tmp/backup-s3-rendered.yaml; exit 1; }

      - name: helm package + template (catches release.yml packaging regressions, ADR 0111)
        # release.yml's own chart job runs `helm package` then attaches/pushes the result --
        # a chart that lints and templates from its source directory can still fail to package
        # (Chart.yaml metadata, .helmignore, dependency lock) or to render once packaged. This
        # exercises that exact path on every PR instead of only discovering it at tag time.
        working-directory: charts/booth-core
        run: |
          helm package . --version 0.0.0-ci --app-version 0.0.0-ci --destination /tmp/dist
          helm template booth-core /tmp/dist/booth-core-0.0.0-ci.tgz \
            --namespace booth-system \
            --set iframeSigningKey=ci-placeholder \
            --set ingress.host=booth.example.test \
            --include-crds > /dev/null
