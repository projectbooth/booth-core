name: Release

# agent-briefs/core.md's extra obligation: every other module's layer-3 integration
# tests, and booth-e2e's nightly smoke test, need a stable, versioned booth-core build to
# deploy against, not main at an arbitrary commit. Pushing a `vX.Y.Z` tag publishes both
# the container image and the Helm chart (packaged, with the image tag pinned to match)
# at that version.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Authenticated pulls get a much higher Docker Hub rate limit than anonymous ones --
      # the build below pulls its base images from docker.io. Guarded so forks and Dependabot
      # (neither receives these org secrets) are skipped rather than failing; this workflow
      # only ever runs on a tag push, so the guard is inert here, not load-bearing.
      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-core:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-core:latest

  chart:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm dependency update
        working-directory: charts/booth-core
        run: helm dependency update

      - name: Package chart at the release version
        working-directory: charts/booth-core
        run: |
          helm package . \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}" \
            --destination ../../dist

      - name: Attach chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

      - name: helm registry login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart as an OCI artifact (ADR 0111)
        run: helm push dist/booth-core-${{ needs.image.outputs.version }}.tgz oci://ghcr.io/projectbooth/charts

  # ADR 0111 item 1: a repo with more than one image publishes each under the same version.
  # The credential sidecar's own continuous publish (publish-credential-sidecar.yml) tags by
  # commit SHA for consumers to pin by digest; this job additionally tags it with the release
  # version so a tagged booth-core release has a matching, version-named sidecar image too.
  credential-sidecar-image:
    needs: image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/projectbooth/credential-sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/credential-sidecar/Dockerfile
          push: false
          load: true
          tags: credential-sidecar:candidate

      - name: Refuse unless the image actually runs (genuinely static, correct flag validation)
        # Same smoke test as publish-credential-sidecar.yml -- this build is independent of
        # that workflow's, so it gets its own proof before anything is pushed.
        run: |
          set -eu
          out=$(docker run --rm credential-sidecar:candidate 2>&1) && { echo "expected a non-zero exit with no flags"; exit 1; }
          echo "$out" | grep -q -- '--kind is required' || { echo "unexpected output: $out"; exit 1; }

          out=$(docker run --rm credential-sidecar:candidate --kind=s3 --scope='{}' --core-url=http://x --workspace=acme --token=t 2>&1) && { echo "expected a non-zero exit with no --credentials-file"; exit 1; }
          echo "$out" | grep -q -- '--credentials-file is required' || { echo "unexpected output: $out"; exit 1; }
          echo "image runs correctly under its real base"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/credential-sidecar/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.image.outputs.version }}
