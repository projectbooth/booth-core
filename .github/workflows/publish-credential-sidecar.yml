name: Publish credential-sidecar

# ADR 0095 / contracts/credential-sidecar.md: builds the credential-sidecar binary from source and
# publishes it to ghcr.io/projectbooth/credential-sidecar — one real artifact every consuming
# chart (booth-notebooks, booth-pipeline, ...) pins by DIGEST, never a floating tag, the same
# publishing discipline ADR 0087/0091 established for ghcr.io/projectbooth/minio-test.
#
# Refuses to publish unless the built image actually runs under its real, distroless, statically-
# linked base (no shell, no libc) — a binary that isn't genuinely static would simply fail to exec
# at all there, which is exactly the failure mode this smoke test exists to catch before anything
# is pushed.
on:
  push:
    branches: [master]
    paths:
      - "cmd/credential-sidecar/**"
      - "internal/sidecar/**"
      - "internal/credentialbroker/**" # the wire types this binary's client reuses directly
      - ".github/workflows/publish-credential-sidecar.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/projectbooth/credential-sidecar
    steps:
      - uses: actions/checkout@v4

      # Authenticated pulls get a much higher Docker Hub rate limit than anonymous ones --
      # both builds below pull their base images from docker.io. Guarded so forks and
      # Dependabot (neither receives these org secrets) are skipped rather than failing; this
      # workflow only ever runs on push to master or manual dispatch, so the guard is inert
      # here, not load-bearing.
      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/credential-sidecar/Dockerfile
          push: false
          load: true
          tags: credential-sidecar:candidate

      - name: Refuse unless the image actually runs (genuinely static, correct flag validation)
        run: |
          set -eu
          # No flags: must exit non-zero with a clear message, not crash with a missing-libc error
          # (the distroless/static base has none — a non-static binary fails differently and
          # immediately, which this would also catch).
          out=$(docker run --rm credential-sidecar:candidate 2>&1) && { echo "expected a non-zero exit with no flags"; exit 1; }
          echo "$out" | grep -q -- '--kind is required' || { echo "unexpected output: $out"; exit 1; }

          out=$(docker run --rm credential-sidecar:candidate --kind=s3 --scope='{}' --core-url=http://x --workspace=acme --token=t 2>&1) && { echo "expected a non-zero exit with no --credentials-file"; exit 1; }
          echo "$out" | grep -q -- '--credentials-file is required' || { echo "unexpected output: $out"; exit 1; }
          echo "image runs correctly under its real base"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/credential-sidecar/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
            ${{ env.IMAGE }}:latest

      - name: Record the pinned digest
        run: |
          echo "PINNED ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          {
            echo "### Published \`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`"
            echo "Also tagged \`${{ steps.version.outputs.sha }}\` and \`latest\` (floating — consumers pin the digest above, not these tags)."
          } >> "$GITHUB_STEP_SUMMARY"
