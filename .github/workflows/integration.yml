name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration tests.
# Runs on merge to main and nightly, not on every push/PR, since it's slower than the
# unit+contract layer.
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 7 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  envtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19

      - name: Provision envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Run real-API-server integration tests
        run: go test ./test/integration/... -v -timeout 120s

  kind-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-core-ci

      - uses: azure/setup-helm@v4

      - name: Build and load booth-core image
        run: |
          docker build -t booth-core:ci .
          kind load docker-image booth-core:ci --name booth-core-ci

      - name: helm dependency update
        working-directory: charts/booth-core
        run: helm dependency update

      - name: Install booth-core chart
        working-directory: charts/booth-core
        run: |
          helm install booth-core . \
            --namespace booth-system --create-namespace \
            --set image.repository=booth-core \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-core \
            --set iframeSigningKey=ci-placeholder \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl -n booth-system get pods
          kubectl -n booth-system rollout status deployment/booth-core --timeout=120s
          kubectl -n booth-system get boothmodules.booth.projectbooth.io || true

      # ADR 0049, end to end on the real NATS server the chart deploys: the bus must
      # require credentials, and a credential provisioned from a BoothModule manifest must
      # actually work. Unit tests prove the permission model against an embedded server;
      # this proves the chart wiring (include, mount, resolver) on the real thing.
      - name: Verify event-bus authentication
        run: |
          set -eu
          kubectl -n booth-system get configmap booth-nats-auth
          kubectl -n booth-system get secret booth-nats-keys

          echo "Waiting for core to connect to the authenticated bus..."
          for i in $(seq 1 60); do
            if kubectl -n booth-system logs deployment/booth-core | grep -q "event bus connected"; then
              echo "core connected with its own credential"; break
            fi
            [ "$i" = 60 ] && { echo "core never connected to the event bus"; exit 1; }
            sleep 3
          done

          kubectl create namespace ci-superset
          cat <<'EOF' | kubectl apply -f -
          apiVersion: booth.projectbooth.io/v1alpha1
          kind: BoothModule
          metadata:
            name: superset
            namespace: ci-superset
          spec:
            id: superset
            displayName: Superset
            version: 0.1.0
            contractVersion: 0.1.0
            hasOwnUi: false
            healthCheckPath: /health
            serviceRef: {name: superset, namespace: ci-superset, port: 8088}
            events:
              publish: ["dashboard.*"]
          EOF

          echo "Waiting for the provisioned credential..."
          for i in $(seq 1 40); do
            kubectl -n ci-superset get secret booth-event-bus-credentials >/dev/null 2>&1 && break
            [ "$i" = 40 ] && { echo "credential Secret never appeared"; exit 1; }
            sleep 3
          done
          kubectl get namespace ci-superset -o jsonpath='{.metadata.labels}' | grep -q event-bus-client

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: bus-check, namespace: ci-superset}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: nats-box
                    image: natsio/nats-box:0.19.7
                    env:
                      - name: NATS_URL
                        valueFrom: {secretKeyRef: {name: booth-event-bus-credentials, key: url}}
                    volumeMounts: [{name: creds, mountPath: /creds}]
                    command: ["sh", "-ec"]
                    args:
                      - |
                        # `nats rtt` exits 0 even when it can't connect, so assert on its
                        # output rather than its exit status.
                        with_creds=$(nats --server "$NATS_URL" --creds /creds/nats.creds rtt 2>&1) || true
                        echo "$with_creds"
                        if echo "$with_creds" | grep -qi "failed"; then
                          echo "the provisioned credential was rejected"; exit 1
                        fi
                        anonymous=$(nats --server "$NATS_URL" rtt 2>&1) || true
                        echo "$anonymous"
                        if ! echo "$anonymous" | grep -qi "authorization violation"; then
                          echo "an anonymous connection was not refused"; exit 1
                        fi
                        echo "auth enforced: credential accepted, anonymous refused"
                volumes:
                  - name: creds
                    secret: {secretName: booth-event-bus-credentials}
          EOF
          kubectl -n ci-superset wait --for=condition=complete job/bus-check --timeout=180s
          kubectl -n ci-superset logs job/bus-check

      # ADR 0053, end to end on the real bundled PostgreSQL: core provisions its own database
      # (so the user directory becomes persistent), and provisions a per-module database when a
      # BoothModule signals it needs one, delivered as a working DSN whose credentials cannot
      # cross into any other database.
      # contracts/module-manifest.md: an unset serviceRef.namespace means the BoothModule's own
      # namespace. Modules' charts leave it unset, so this is the shape that must work: core
      # once built `name..svc.cluster.local`, marking every such module Unreachable.
      - name: Verify serviceRef.namespace defaults to the BoothModule's namespace
        run: |
          set -eu
          kubectl create namespace ci-default-ns
          kubectl -n ci-default-ns create deployment echo --image=nginx:alpine --port=80
          kubectl -n ci-default-ns expose deployment echo --port=80
          kubectl -n ci-default-ns rollout status deployment/echo --timeout=120s
          cat <<'EOF' | kubectl apply -f -
          apiVersion: booth.projectbooth.io/v1alpha1
          kind: BoothModule
          metadata:
            name: echo
            namespace: ci-default-ns
          spec:
            id: echo
            displayName: Echo
            version: 0.1.0
            contractVersion: 0.1.0
            hasOwnUi: false
            healthCheckPath: /
            serviceRef: {name: echo, port: 80}
          EOF
          for i in $(seq 1 40); do
            phase=$(kubectl -n ci-default-ns get boothmodule echo -o jsonpath='{.status.phase}')
            [ "$phase" = Healthy ] && { echo "echo is Healthy"; exit 0; }
            sleep 3
          done
          kubectl -n ci-default-ns get boothmodule echo -o yaml
          echo "module without serviceRef.namespace never became Healthy"
          exit 1

      # ADR 0056, on the deployed chart: core serves its JWKS, delivers a minting credential only
      # to a module that declares workloadIdentity, and the credential really opens the minting
      # endpoint (while nothing else does). The OIDC issuer in this install is a placeholder, so
      # no human token can exist here: minting a real token — and the role rules — are covered by
      # the unit tests against a real verifier. What only a deployment can show is the wiring.
      - name: Verify workload identity
        run: |
          set -eu
          kubectl create namespace ci-workload
          cat <<'EOF' | kubectl apply -f -
          apiVersion: booth.projectbooth.io/v1alpha1
          kind: BoothModule
          metadata:
            name: runner
            namespace: ci-workload
          spec:
            id: runner
            displayName: Runner
            version: 0.1.0
            contractVersion: 0.1.0
            hasOwnUi: false
            healthCheckPath: /health
            serviceRef: {name: runner, port: 8080}
            workloadIdentity: {mint: true}
          EOF

          echo "Waiting for the minting credential..."
          for i in $(seq 1 40); do
            kubectl -n ci-workload get secret booth-workload-minting-credentials >/dev/null 2>&1 && break
            [ "$i" = 40 ] && { echo "minting credential Secret never appeared"; exit 1; }
            sleep 3
          done

          # ci-default-ns/echo (from the earlier step) never declared the field: nothing for it.
          if kubectl -n ci-default-ns get secret booth-workload-minting-credentials >/dev/null 2>&1; then
            echo "a module that never declared workloadIdentity received a minting credential"; exit 1
          fi

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: mint-check, namespace: ci-workload}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    env:
                      - {name: CRED, valueFrom: {secretKeyRef: {name: booth-workload-minting-credentials, key: credential}}}
                      - {name: URL, valueFrom: {secretKeyRef: {name: booth-workload-minting-credentials, key: url}}}
                      - {name: ISSUER, valueFrom: {secretKeyRef: {name: booth-workload-minting-credentials, key: issuer}}}
                    command: ["sh", "-ec"]
                    args:
                      - |
                        code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
                        BODY='{"workspace":"ci","subject":"job:1","roleCeiling":"viewer","owner":"nobody"}'

                        # Public: the keys and discovery document other modules trust.
                        curl -fsS "$ISSUER/.well-known/jwks.json" | grep -q '"RS256"'
                        curl -fsS "$ISSUER/.well-known/openid-configuration" | grep -q "\"issuer\":\"$ISSUER\""

                        # No credential, and a made-up one: refused.
                        [ "$(code -X POST "$URL" -d "$BODY")" = 401 ]
                        [ "$(code -X POST "$URL" -H 'Authorization: Bearer bwmc.runner.AAAA' -d "$BODY")" = 401 ]

                        # The provisioned credential is accepted as far as authentication goes:
                        # core has never seen an owner called "nobody", so it declines to mint (403)
                        # rather than refusing the caller (401).
                        got=$(code -X POST "$URL" -H "Authorization: Bearer $CRED" -H 'Content-Type: application/json' -d "$BODY")
                        [ "$got" = 403 ] || { echo "expected 403 for an unknown owner, got $got"; exit 1; }
                        echo "workload identity wiring verified"
          EOF
          kubectl -n ci-workload wait --for=condition=complete job/mint-check --timeout=180s || {
            kubectl -n ci-workload logs job/mint-check || true; exit 1; }
          kubectl -n ci-workload logs job/mint-check

      # ADR 0069: a third, distinct issuer for the iframe-proxy path, on by default
      # (iframeIdentity.enabled, values.yaml) — no BoothModule/manifest opt-in needed, so this
      # just needs to prove core is actually serving it on the deployed chart, at the address the
      # chart's own default derives, and that it's genuinely a different issuer from the
      # workload-token one already verified above.
      - name: Verify iframe-proxy identity issuer
        run: |
          set -eu
          echo "Waiting for the iframe-proxy identity issuer to come up..."
          for i in $(seq 1 40); do
            if kubectl -n booth-system logs deployment/booth-core | grep -q "iframe-proxy identity issuer enabled"; then
              echo "iframe-proxy identity issuer is up"; break
            fi
            [ "$i" = 40 ] && { echo "iframe-proxy identity issuer never came up"; exit 1; }
            sleep 3
          done

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: iframe-identity-check, namespace: booth-system}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    env:
                      - {name: ISSUER, value: "http://booth-core.booth-system.svc.cluster.local:8080/iframe-identity"}
                      - {name: WORKLOAD_ISSUER, value: "http://booth-core.booth-system.svc.cluster.local:8080"}
                    command: ["sh", "-ec"]
                    args:
                      - |
                        # The chart's default issuer URL (the in-cluster Service, under /iframe-identity).
                        jwks=$(curl -fsS "$ISSUER/.well-known/jwks.json")
                        echo "$jwks" | grep -q '"RS256"'
                        curl -fsS "$ISSUER/.well-known/openid-configuration" | grep -q "\"issuer\":\"$ISSUER\""

                        # Distinct from the workload-token issuer already verified above: different
                        # URL (checked implicitly by hitting a different path) and a different key.
                        workload_jwks=$(curl -fsS "$WORKLOAD_ISSUER/.well-known/jwks.json")
                        iframe_kid=$(echo "$jwks" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
                        workload_kid=$(echo "$workload_jwks" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
                        [ -n "$iframe_kid" ] && [ -n "$workload_kid" ] || { echo "could not extract a kid from one of the JWKS documents"; exit 1; }
                        if [ "$iframe_kid" = "$workload_kid" ]; then
                          echo "iframe-identity and workload issuers published the same key id"; exit 1
                        fi
                        echo "iframe-proxy identity issuer wiring verified (distinct from the workload issuer)"
          EOF
          kubectl -n booth-system wait --for=condition=complete job/iframe-identity-check --timeout=120s || {
            kubectl -n booth-system logs job/iframe-identity-check || true; exit 1; }
          kubectl -n booth-system logs job/iframe-identity-check

      - name: Verify database provisioning
        run: |
          set -eu
          kubectl -n booth-system get secret booth-postgres-admin

          echo "Waiting for core to provision its own database..."
          for i in $(seq 1 80); do
            if kubectl -n booth-system logs deployment/booth-core | grep -q "user directory is now persistent"; then
              echo "core database provisioned; the user directory is persistent"; break
            fi
            [ "$i" = 80 ] && { echo "core never provisioned its database"; exit 1; }
            sleep 3
          done
          kubectl -n booth-system get secret booth-core-database

          # The module from the previous step now also asks for a database.
          kubectl -n ci-superset patch boothmodule superset --type merge -p '{"spec":{"database":{"enabled":true}}}'
          echo "Waiting for the module's database credentials..."
          for i in $(seq 1 40); do
            kubectl -n ci-superset get secret booth-database-credentials >/dev/null 2>&1 && break
            [ "$i" = 40 ] && { echo "database credential Secret never appeared"; exit 1; }
            sleep 3
          done
          kubectl get namespace ci-superset -o jsonpath='{.metadata.labels}' | grep -q database-client

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: db-check, namespace: ci-superset}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: psql
                    image: postgres:16-alpine
                    env:
                      - name: DSN
                        valueFrom: {secretKeyRef: {name: booth-database-credentials, key: dsn}}
                    command: ["sh", "-ec"]
                    args:
                      - |
                        # The module can use its own database.
                        psql "$DSN" -v ON_ERROR_STOP=1                           -c 'create table t (x int)' -c 'insert into t values (42)' -c 'select x from t'

                        # ...but its credentials can't open any other database on the server.
                        core_dsn=$(echo "$DSN" | sed 's#/booth_mod_superset#/booth_core#')
                        if psql "$core_dsn" -c 'select 1' >/dev/null 2>&1; then
                          echo "module credentials opened core's database"; exit 1
                        fi
                        maint_dsn=$(echo "$DSN" | sed 's#/booth_mod_superset#/postgres#')
                        if psql "$maint_dsn" -c 'select 1' >/dev/null 2>&1; then
                          echo "module credentials opened the maintenance database"; exit 1
                        fi
                        echo "database provisioned and isolated"
          EOF
          kubectl -n ci-superset wait --for=condition=complete job/db-check --timeout=180s
          kubectl -n ci-superset logs job/db-check

      # ADR 0054: the scheduled pg_dump backup of the bundled PostgreSQL, run for real. Proves
      # the backup is complete and usable — including restoring a module's database into a
      # scratch database and reading its data back — and that retention prunes.
      - name: Verify backup and restore (PVC)
        run: |
          set -eu
          kubectl -n booth-system get cronjob booth-core-postgresql-backup

          # 1. Run the actual CronJob once.
          kubectl -n booth-system create job --from=cronjob/booth-core-postgresql-backup backup-now
          kubectl -n booth-system wait --for=condition=complete job/backup-now --timeout=300s
          kubectl -n booth-system logs job/backup-now

          # 2. Inspect and use what it produced, from a pod that mounts the same PVC. The label
          #    is what the PostgreSQL NetworkPolicy admits.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: backup-verify, namespace: booth-system}
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: postgresql-backup
                  app.kubernetes.io/instance: booth-core
              spec:
                restartPolicy: Never
                securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}
                containers:
                  - name: verify
                    image: postgres:16-alpine
                    env:
                      - {name: PGHOST, value: booth-core-postgresql}
                      - {name: PGUSER, value: postgres}
                      - {name: PGSSLMODE, value: disable}
                      - name: PGPASSWORD
                        valueFrom: {secretKeyRef: {name: booth-postgres-admin, key: password}}
                    command: ["sh", "-eu", "-c"]
                    args:
                      - |
                        latest=$(ls -1d /backups/[0-9]*T*Z | sort | tail -1)
                        echo "verifying $latest"; ls -l "$latest"

                        # Complete, and containing what a restore needs.
                        test -s "$latest/MANIFEST"
                        test -s "$latest/globals.sql"
                        grep -q 'CREATE ROLE booth_mod_superset' "$latest/globals.sql"
                        test -s "$latest/booth_core.dump"
                        test -s "$latest/booth_mod_superset.dump"

                        # Restore the module's database into a scratch database and read its
                        # data back: the table the module created earlier (value 42).
                        createdb restore_check
                        pg_restore --no-owner --dbname=restore_check "$latest/booth_mod_superset.dump"
                        got=$(psql -Atq -d restore_check -c 'select x from t')
                        test "$got" = 42 || { echo "restored data was '$got', expected 42"; exit 1; }
                        dropdb restore_check
                        echo "scratch restore verified"

                        # The exact in-place restore command from docs/runbooks: after the
                        # database has drifted from the backup, restoring rolls it back, and
                        # the objects end up owned by the module's own role.
                        psql -Atq -d booth_mod_superset -c 'insert into t values (99)'
                        pg_restore --clean --if-exists --no-owner --role=booth_mod_superset                           --dbname=booth_mod_superset "$latest/booth_mod_superset.dump"
                        got=$(psql -Atq -d booth_mod_superset -c "select string_agg(x::text, ',' order by x) from t")
                        test "$got" = 42 || { echo "in-place restore left '$got', expected only 42"; exit 1; }
                        owner=$(psql -Atq -d booth_mod_superset -c "select tableowner from pg_tables where tablename = 't'")
                        test "$owner" = booth_mod_superset || { echo "restored table owned by '$owner'"; exit 1; }
                        echo "in-place restore verified"

                        # Retention: keep only the newest N, and never leave incomplete runs.
                        for i in 1 2 3; do
                          sleep 1
                          BACKUP_MODE=pvc BACKUP_DIR=/backups RETENTION=2 sh /scripts/pg-backup.sh >/dev/null
                        done
                        n=$(ls -1d /backups/[0-9]*T*Z | wc -l)
                        test "$n" = 2 || { echo "expected 2 backups after pruning, found $n"; ls -l /backups; exit 1; }
                        if ls -d /backups/.incomplete-* >/dev/null 2>&1; then
                          echo "an incomplete backup was left behind"; exit 1
                        fi
                        echo "backup, restore, and retention verified"
                    volumeMounts:
                      - {name: backups, mountPath: /backups}
                      - {name: scripts, mountPath: /scripts, readOnly: true}
                volumes:
                  - name: backups
                    persistentVolumeClaim: {claimName: booth-core-postgresql-backup}
                  - name: scripts
                    configMap: {name: booth-core-postgresql-backup-script}
          EOF
          kubectl -n booth-system wait --for=condition=complete job/backup-verify --timeout=300s
          kubectl -n booth-system logs job/backup-verify

      # The same backup, shipped to S3-compatible object storage (a MinIO in the cluster).
      - name: Verify backup to object storage (S3)
        run: |
          set -eu
          kubectl create namespace ci-minio
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: minio, namespace: ci-minio}
          spec:
            replicas: 1
            selector: {matchLabels: {app: minio}}
            template:
              metadata: {labels: {app: minio}}
              spec:
                containers:
                  - name: minio
                    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
                    args: ["server", "/data"]
                    env:
                      - {name: MINIO_ROOT_USER, value: ci-access-key}
                      - {name: MINIO_ROOT_PASSWORD, value: ci-secret-key-0123456789}
                    ports: [{containerPort: 9000}]
                    readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, periodSeconds: 3}
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: minio, namespace: ci-minio}
          spec:
            selector: {app: minio}
            ports: [{port: 9000, targetPort: 9000}]
          EOF
          kubectl -n ci-minio rollout status deployment/minio --timeout=180s

          kubectl -n booth-system create secret generic minio-creds \
            --from-literal=AWS_ACCESS_KEY_ID=ci-access-key \
            --from-literal=AWS_SECRET_ACCESS_KEY=ci-secret-key-0123456789

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: make-bucket, namespace: booth-system}
          spec:
            backoffLimit: 3
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: aws
                    image: amazon/aws-cli:2.36.49
                    envFrom: [{secretRef: {name: minio-creds}}]
                    env: [{name: AWS_DEFAULT_REGION, value: us-east-1}]
                    args: ["--endpoint-url", "http://minio.ci-minio:9000", "s3", "mb", "s3://booth-backups"]
          EOF
          kubectl -n booth-system wait --for=condition=complete job/make-bucket --timeout=180s

          # Switch the chart's backup destination from the PVC to the bucket.
          helm upgrade booth-core charts/booth-core --namespace booth-system --reuse-values \
            --set postgresql.backup.s3.bucket=booth-backups \
            --set postgresql.backup.s3.endpoint=http://minio.ci-minio:9000 \
            --set postgresql.backup.s3.existingSecret=minio-creds \
            --wait --timeout 5m

          kubectl -n booth-system create job --from=cronjob/booth-core-postgresql-backup s3-backup-now
          kubectl -n booth-system wait --for=condition=complete job/s3-backup-now --timeout=300s
          kubectl -n booth-system logs job/s3-backup-now --all-containers

          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: list-bucket, namespace: booth-system}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: aws
                    image: amazon/aws-cli:2.36.49
                    envFrom: [{secretRef: {name: minio-creds}}]
                    env: [{name: AWS_DEFAULT_REGION, value: us-east-1}]
                    command: ["sh", "-ec"]
                    args:
                      - |
                        out=$(aws --endpoint-url http://minio.ci-minio:9000 s3 ls --recursive s3://booth-backups/booth-postgres/)
                        echo "$out"
                        for f in globals.sql MANIFEST booth_core.dump booth_mod_superset.dump; do
                          echo "$out" | grep -q "/$f\$" || { echo "missing $f in the bucket"; exit 1; }
                        done
                        echo "object-storage backup verified"
          EOF
          kubectl -n booth-system wait --for=condition=complete job/list-bucket --timeout=180s
          kubectl -n booth-system logs job/list-bucket

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n booth-system get all
          kubectl -n booth-system logs deployment/booth-core --tail=200 || true
          kubectl -n booth-system logs statefulset/booth-core-nats -c nats --tail=100 || true
          kubectl -n ci-superset logs job/bus-check --tail=50 || true
          kubectl -n booth-system logs statefulset/booth-core-postgresql --tail=60 || true
