{{- if and .Values.nats.enabled .Values.networkPolicy.enabled }}
# ADR 0049, defense in depth: even with credential auth, don't let arbitrary pods in the
# cluster reach the event bus at all. Ingress to NATS is admitted only from:
#   - booth-core itself;
#   - other NATS pods (cluster routing, and the monitoring port for probes);
#   - namespaces booth-core has labelled as event-bus clients, i.e. those hosting a module
#     that declared `events` in its BoothModule manifest.
# Policies are additive and there is no default-deny here, so this only ever narrows access
# to the NATS pods selected below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "booth-core.fullname" . }}-nats
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 4222
      from:
        - podSelector:
            matchLabels:
              {{- include "booth-core.selectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              booth.projectbooth.io/event-bus-client: "true"
    - ports:
        - protocol: TCP
          port: 6222
        - protocol: TCP
          port: 8222
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
