apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-core.fullname" . }}
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-core.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "booth-core.serviceAccountName" . }}
      containers:
        - name: booth-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            - name: BOOTH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ .Values.oidc.requireAudience | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            {{- if .Values.workloadIdentity.enabled }}
            # ADR 0056: core as a second token issuer. The URL is where modules reach core (it
            # serves the JWKS and the minting endpoint); it becomes the `iss` of minted tokens.
            - name: BOOTH_WORKLOAD_ISSUER_URL
              value: {{ .Values.workloadIdentity.issuerUrl | default (printf "http://%s.%s.svc.cluster.local:%v" (include "booth-core.fullname" .) .Release.Namespace .Values.service.port) | quote }}
            - name: BOOTH_WORKLOAD_OWNER_MAX_AGE
              value: {{ .Values.workloadIdentity.ownerMaxAge | quote }}
            {{- end }}
            {{- if .Values.nats.enabled }}
            - name: BOOTH_NATS_URL
              value: "nats://{{ .Release.Name }}-nats:4222"
            # Where modules (in other namespaces) reach the bus; written into their
            # credential Secrets.
            - name: BOOTH_NATS_MODULE_URL
              value: "nats://{{ .Release.Name }}-nats.{{ .Release.Namespace }}.svc.cluster.local:4222"
            # Always on in the chart: the NATS subchart is configured (values.yaml) to
            # include the trust config core generates, so the two only work together.
            - name: BOOTH_EVENTBUS_AUTH
              value: "true"
            {{- end }}
            - name: BOOTH_IFRAME_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "booth-core.secretName" . }}
                  key: BOOTH_IFRAME_SIGNING_KEY
            {{- if .Values.postgresql.enabled }}
            # Bundled server (ADR 0053): core generates its admin password Secret, which the
            # StatefulSet reads too, and provisions databases on it.
            - name: BOOTH_POSTGRES_BUNDLED
              value: "true"
            - name: BOOTH_POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: BOOTH_POSTGRES_SSLMODE
              value: "disable"
            {{- if and .Values.postgresql.backup.enabled (not .Values.postgresql.backup.s3.bucket) }}
            # The backup CronJob's PVC is created by core, not Helm (see templates/postgresql-backup.yaml).
            - name: BOOTH_POSTGRES_BACKUP_PVC_NAME
              value: "{{ .Release.Name }}-postgresql-backup"
            - name: BOOTH_POSTGRES_BACKUP_PVC_SIZE
              value: {{ .Values.postgresql.backup.persistence.size | quote }}
            - name: BOOTH_POSTGRES_BACKUP_PVC_STORAGE_CLASS
              value: {{ .Values.postgresql.backup.persistence.storageClass | quote }}
            {{- end }}
            {{- else if .Values.postgres.external.host }}
            - name: BOOTH_POSTGRES_HOST
              value: {{ .Values.postgres.external.host | quote }}
            - name: BOOTH_POSTGRES_PORT
              value: {{ .Values.postgres.external.port | quote }}
            - name: BOOTH_POSTGRES_ADMIN_USER
              value: {{ .Values.postgres.external.adminUser | quote }}
            - name: BOOTH_POSTGRES_ADMIN_DATABASE
              value: {{ .Values.postgres.external.adminDatabase | quote }}
            - name: BOOTH_POSTGRES_SSLMODE
              value: {{ .Values.postgres.external.sslmode | quote }}
            - name: BOOTH_POSTGRES_RESTRICT_MAINTENANCE_ACCESS
              value: {{ .Values.postgres.external.restrictMaintenanceAccess | quote }}
            - name: BOOTH_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.external.existingSecret.name is required when postgres.external.host is set" .Values.postgres.external.existingSecret.name }}
                  key: {{ .Values.postgres.external.existingSecret.key }}
            {{- end }}
            {{- if or .Values.postgres.dsn .Values.existingSecret }}
            - name: BOOTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "booth-core.secretName" . }}
                  key: BOOTH_POSTGRES_DSN
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
