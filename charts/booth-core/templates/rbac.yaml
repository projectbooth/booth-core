{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "booth-core.fullname" . }}
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
rules:
  # ADR 0019: watch BoothModule resources cluster-wide and update their status
  # subresource (internal/registry/controller.go).
  - apiGroups: ["booth.projectbooth.io"]
    resources: ["boothmodules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["booth.projectbooth.io"]
    resources: ["boothmodules/status"]
    verbs: ["get", "update", "patch"]
  #
  # Deliberately broad, not an oversight: internal/lifecycle installs arbitrary
  # module Helm charts (ADR 0003's install/uninstall lifecycle), which can create
  # arbitrary namespaced Kubernetes resources — Deployments, Services, RBAC objects,
  # PVCs, whatever a given module's chart templates. Scoping this down to a real
  # least-privilege policy (e.g. per-module RBAC delegation, or a bundled allowlist
  # of resource kinds modules may create) is flagged as necessary follow-up work,
  # not solved by this chart. Every real deployment should treat booth-core's
  # service account as an effectively cluster-admin-equivalent identity until that
  # follow-up lands.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "booth-core.fullname" . }}
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "booth-core.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "booth-core.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
