{{- if .Values.keycloak.enabled }}
# Bundled Keycloak (ADR 0106/0108) — the default identity provider for self-hosted installs,
# mirroring postgresql.yaml's own precedent: a small, repo-owned template on the official
# image, pinned by digest, not a third-party chart and not the Keycloak Operator. Switchable
# off with keycloak.enabled=false plus the existing oidc.* values for an external provider,
# the same pattern as bundled NATS/PostgreSQL.
#
# No Ingress exists yet (ADR 0108's Ingress/TLS work is a separate, later change) — this
# Keycloak is reachable in-cluster only (its own Service DNS name), which is enough for core
# and every module's own token verification (ADR 0108's oidc.jwksUrl) and for booth-admin via
# port-forward, but not yet for a real browser login. See _helpers.tpl's "keycloak*" templates
# for where KC_HOSTNAME and oidc.issuerUrl/jwksUrl are computed from the same source so they
# cannot independently drift.
#
# The database credentials (Secret booth-keycloak-db) and the bootstrap admin credential
# (Secret booth-keycloak-admin) are both generated by core itself at startup, never a chart
# default — this pod waits in ContainerCreating until core has created them, the identical
# pattern postgresql.yaml's own comment documents for the bundled PostgreSQL's superuser
# password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booth-core.keycloakFullname" . }}-realm
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  booth-realm.json: |
    {{- tpl (.Files.Get "files/keycloak-realm.json.tpl") $ | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "booth-core.keycloakFullname" . }}
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-core.keycloakFullname" . }}
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}@{{ .Values.keycloak.image.digest }}"
          args: ["start", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: booth-keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: booth-keycloak-admin, key: password}}
            # Hostname v2 (ADR 0106 item c): one fixed, explicit issuer, independent of
            # whatever Host header a given request happens to arrive with -- the real fix for
            # the issuer-matching problem booth-e2e's own bring-up script had to work around
            # by aliasing /etc/hosts instead. Confirmed against this pinned image by running
            # it, not from memory (booth-core PR #5's spike, commit 3187046).
            - name: KC_HOSTNAME
              value: {{ include "booth-core.keycloakBaseUrl" . | quote }}
            # TLS terminates at a future Ingress, not this pod -- Keycloak's own listener
            # stays plain http regardless of KC_HOSTNAME's eventual scheme (ADR 0108).
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              valueFrom: {secretKeyRef: {name: booth-keycloak-db, key: host}}
            - name: KC_DB_URL_PORT
              valueFrom: {secretKeyRef: {name: booth-keycloak-db, key: port}}
            - name: KC_DB_URL_DATABASE
              valueFrom: {secretKeyRef: {name: booth-keycloak-db, key: database}}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: booth-keycloak-db, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: booth-keycloak-db, key: password}}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: "/realms/{{ include "booth-core.keycloakRealm" . }}", port: http}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: "/realms/{{ include "booth-core.keycloakRealm" . }}", port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: {{ include "booth-core.keycloakFullname" . }}-realm
{{- end }}
