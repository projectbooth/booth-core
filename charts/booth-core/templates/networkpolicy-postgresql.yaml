{{- if and .Values.postgresql.enabled .Values.networkPolicy.enabled }}
# ADR 0053, defense in depth (mirrors the NATS policy): even with per-module credentials, only
# booth-core and namespaces it has labelled as database clients — those hosting a module that
# declared `database.enabled` — can reach the bundled PostgreSQL at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "booth-core.fullname" . }}-postgresql
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5432
      from:
        - podSelector:
            matchLabels:
              {{- include "booth-core.selectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              booth.projectbooth.io/database-client: "true"
{{- end }}
