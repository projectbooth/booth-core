{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
{{- $b := .Values.postgresql.backup }}
{{- $s3 := ne (toString $b.s3.bucket) "" }}
# Scheduled logical backup of the bundled PostgreSQL (ADR 0054) — a v0 baseline: a daily
# pg_dump of every database plus the roles, NOT point-in-time recovery. Only for the bundled
# server; an external cluster's backup is the operator's own.
#
# Destination: a PVC in this cluster by default, or an S3-compatible bucket when
# postgresql.backup.s3.bucket is set. A backup on the same cluster/storage as the database
# doesn't survive losing that cluster — for real disaster recovery use a bucket, or copy the
# PVC's contents off-cluster. See docs/runbooks/postgres-backup-restore.md for restore.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgresql-backup-script
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
data:
  pg-backup.sh: |
{{ .Files.Get "files/pg-backup.sh" | indent 4 }}
{{- if not $s3 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgresql-backup
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
  annotations:
    # Never delete backups because someone ran `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $b.persistence.storageClass }}
  storageClassName: {{ $b.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $b.persistence.size }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-postgresql-backup
  labels:
    {{- include "booth-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
spec:
  schedule: {{ $b.schedule | quote }}
  # Two backups must never run at once: they'd race on the retention pruning.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            # The PostgreSQL NetworkPolicy admits exactly these pods.
            app.kubernetes.io/name: postgresql-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          securityContext:
            # uid/gid 70 is the postgres user in the alpine image.
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          {{- if $s3 }}
          initContainers:
            - name: dump
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
              command: ["sh", "/scripts/pg-backup.sh"]
              env:
                - {name: BACKUP_MODE, value: stage}
                - {name: STAGE_DIR, value: /stage}
                - {name: PGHOST, value: "{{ .Release.Name }}-postgresql"}
                - {name: PGUSER, value: postgres}
                - {name: PGSSLMODE, value: disable}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: booth-postgres-admin, key: password}}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: stage, mountPath: /stage}
              resources:
                {{- toYaml $b.resources | nindent 16 }}
          containers:
            - name: upload
              image: "{{ $b.image.repository }}:{{ $b.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  ts=$(cat /stage/ts)
                  dest="s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}${ts}/"
                  echo "uploading to ${dest}"
                  if [ -n "${BACKUP_ENDPOINT:-}" ]; then
                    aws s3 cp --recursive --endpoint-url "${BACKUP_ENDPOINT}" /stage/dump "${dest}"
                  else
                    aws s3 cp --recursive /stage/dump "${dest}"
                  fi
                  echo "upload complete"
              envFrom:
                # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (and optionally AWS_SESSION_TOKEN).
                - secretRef:
                    name: {{ required "postgresql.backup.s3.existingSecret is required when postgresql.backup.s3.bucket is set" $b.s3.existingSecret }}
              env:
                - {name: BACKUP_BUCKET, value: {{ $b.s3.bucket | quote }}}
                - {name: BACKUP_PREFIX, value: {{ $b.s3.prefix | quote }}}
                - {name: BACKUP_ENDPOINT, value: {{ $b.s3.endpoint | quote }}}
                - {name: AWS_DEFAULT_REGION, value: {{ $b.s3.region | quote }}}
              volumeMounts:
                - {name: stage, mountPath: /stage, readOnly: true}
          volumes:
            - name: scripts
              configMap: {name: {{ .Release.Name }}-postgresql-backup-script}
            - name: stage
              emptyDir: {}
          {{- else }}
          containers:
            - name: backup
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
              command: ["sh", "/scripts/pg-backup.sh"]
              env:
                - {name: BACKUP_MODE, value: pvc}
                - {name: BACKUP_DIR, value: /backups}
                - {name: RETENTION, value: {{ $b.retention | quote }}}
                - {name: PGHOST, value: "{{ .Release.Name }}-postgresql"}
                - {name: PGUSER, value: postgres}
                - {name: PGSSLMODE, value: disable}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: booth-postgres-admin, key: password}}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: backups, mountPath: /backups}
              resources:
                {{- toYaml $b.resources | nindent 16 }}
          volumes:
            - name: scripts
              configMap: {name: {{ .Release.Name }}-postgresql-backup-script}
            - name: backups
              persistentVolumeClaim: {claimName: {{ .Release.Name }}-postgresql-backup}
          {{- end }}
{{- end }}
