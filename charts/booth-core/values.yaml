# Default values for booth-core. See docs/decisions/ for the reasoning behind each
# subsystem's shape.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-core
  tag: "" # defaults to Chart.appVersion; overridden by CI to the published tag (contracts/testing-strategy.md)
  pullPolicy: IfNotPresent

service:
  port: 8080

# Every deployment of Project Booth must run booth-core, so this chart is expected to be
# installed once per deployment, into its own namespace (default booth-system).
namespaceOverride: ""

oidc:
  # The OIDC issuer URL and client ID (ADR 0004). Left empty here by default, but NOT
  # actually empty for the bundled install below: when keycloak.enabled (the default), an
  # empty issuerUrl/clientId/jwksUrl here means "use the bundled Keycloak's own values",
  # computed by this chart itself (_helpers.tpl's "effectiveOidc*" templates) so they
  # cannot drift from Keycloak's own KC_HOSTNAME. Set these explicitly to point at your
  # own external IdP instead (keycloak.enabled=false then costs nothing to flip).
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  groupsClaim: groups
  # Optional key-fetch override (ADR 0108): when set, core fetches signing keys from
  # this URL directly instead of the issuer's own discovery document, while still
  # validating `iss` exactly against issuerUrl. The bundled install (above) sets this
  # automatically to Keycloak's in-cluster Service over plain http, so core never needs to
  # trust a self-signed Ingress certificate just to verify tokens. Setting this without
  # issuerUrl is a startup error. Empty with keycloak.enabled=false (an external provider)
  # means ordinary discovery, unchanged.
  jwksUrl: ""

# Workload identity (ADR 0056): booth-core acts as a second trusted token issuer, for exactly
# one purpose — short-lived (10 minute), workspace-scoped tokens that represent a job/run rather
# than a person, so unattended work (a scheduled pipeline run) can call other modules. A module
# gets a minting credential (the Secret `booth-workload-minting-credentials` in its namespace)
# only if its BoothModule declares `workloadIdentity: {mint: true}`.
#
# Every module that should accept these tokens must be configured to trust this issuer's keys
# (published at <issuer>/.well-known/jwks.json, plus OIDC discovery at the standard path).
# Don't expose /api/internal/* through an ingress: it's for in-cluster callers.
workloadIdentity:
  enabled: true
  # The URL modules use to reach booth-core, and the `iss` of minted tokens. Empty = this
  # release's in-cluster Service. Must be resolvable from every module's namespace, and must
  # not change once modules are configured to trust it.
  issuerUrl: ""
  # A run's role is capped at its owner's role in the workspace, which core learns from the
  # owner's own tokens (ADR 0025 makes tokens the only source). If core hasn't seen the owner
  # for longer than this, it stops minting for their runs — the bound on how long a user
  # removed from the IdP, who never signs in again, keeps unattended jobs privileged. Raise it
  # if runs are owned by people who rarely open the UI.
  ownerMaxAge: 168h

# Iframe-proxy identity assertion (ADR 0069): on every request proxied via
# uiIntegrationMode: iframe-proxy (ADR 0005 — Superset, Metabase, booth-spark, booth-notebooks),
# core attaches a signed X-Booth-Identity JWT, because that path has no bearer token to forward
# at all (a plain iframe navigation can't carry one, and the browser's own token never leaves
# memory, ADR 0032). A module trusts it exactly the way it trusts the deployment's OIDC provider
# or the workload-token issuer: via the discovery document published at
# <issuerUrl>/.well-known/openid-configuration.
#
# This is a separate issuer from workloadIdentity above, on purpose — a workload token never
# represents a person, and this assertion always does. Don't point a module at the wrong one.
iframeIdentity:
  enabled: true
  # The URL an iframe-proxy module uses to trust core as this issuer. Empty = this release's
  # in-cluster Service, under /iframe-identity (kept distinct from workloadIdentity.issuerUrl even
  # when both default to the same Service). Must be resolvable from every iframe-proxy module's
  # namespace, and must not change once a module is configured to trust it.
  issuerUrl: ""

# Credential broker (ADR 0080): hands a task or module a short-lived native-protocol credential
# (a scoped S3/Postgres credential) that can't go through the ordinary HTTP gateway path.
# Deliberately separate from workloadIdentity above — see contracts/credential-broker.md. Always
# on (POST /api/credentials, plus provisioning `booth-credential-broker-provider-credentials` for
# any module declaring `providesCredentials`); nothing to toggle here.
credentialBroker:
  # Ceiling on ttlSeconds a caller may request, deliberately stricter than workloadIdentity's
  # 10-minute token default — a raw native credential can't be revoked mid-flight the way a
  # gateway-checked token can. A provider's own floor (e.g. MinIO's 15-minute minimum for an
  # expiring service account) may still clamp a grant back up past this; that's the provider's
  # documented capability limit, not a violation of this ceiling.
  maxTTL: 5m

# Iframe-proxy session signing key (ui-integration.md). Required for more than one
# replica — see docs/decisions and internal/gateway/iframetoken.go's doc comment for why
# a shared key (not a per-pod ephemeral one) matters once replicaCount > 1. Populate via
# --set-string or a pre-created Secret referenced through existingSecret below; left
# empty here deliberately rather than defaulting to a value that would ship identically
# across every install.
iframeSigningKey: ""
# existingSecret, if set, names a pre-existing Secret with a BOOTH_IFRAME_SIGNING_KEY key
# to use instead of iframeSigningKey above.
existingSecret: ""

# PostgreSQL (ADR 0053): "batteries included, swappable", like NATS and Keycloak.
#
# By default a small single-node PostgreSQL is deployed with this release — fine for a
# self-hosted or development install, and it gives booth-core's own user directory real
# persistence out of the box. It is NOT highly available; at scale, point at an external HA
# cluster instead (postgresql.enabled=false and fill in postgres.external below).
#
# Either way, booth-core provisions a database and login role for itself and for every module
# whose BoothModule declares `database.enabled: true`, and delivers each module's connection
# details as the Secret `booth-database-credentials` in the module's namespace. Nothing is
# ever dropped automatically: uninstalling a module keeps its data.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    storageClass: "" # empty = the cluster default
  resources: {}

  # Scheduled logical backup of the bundled server (ADR 0054): a daily pg_dump of every
  # database plus the roles. A v0 baseline — NOT point-in-time recovery. Restore and
  # major-version upgrade are manual: docs/runbooks/postgres-backup-restore.md.
  # Does nothing for an external cluster; its backup is yours.
  #
  # By default backups go to a PVC in this cluster, which does not survive losing the cluster.
  # For real disaster recovery set s3.bucket (any S3-compatible store) or copy the PVC off-site.
  backup:
    enabled: true
    schedule: "0 3 * * *" # daily, 03:00 (cluster time zone, normally UTC)
    retention: 7 # complete backups kept on the PVC; for a bucket use its lifecycle policy
    persistence:
      size: 8Gi
      storageClass: ""
    # Setting a bucket switches the destination from the PVC to S3-compatible object storage.
    s3:
      bucket: ""
      prefix: "booth-postgres/"
      endpoint: "" # empty = AWS; set for MinIO, Ceph, R2, etc.
      region: us-east-1
      # A Secret in this release's namespace with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
      existingSecret: ""
    image: # the uploader used only when s3.bucket is set
      repository: amazon/aws-cli
      tag: "2.36.49"
    resources: {}

# Bundled Keycloak (ADR 0106/0108): the default identity provider for self-hosted installs.
# Switchable off with keycloak.enabled=false plus the existing oidc.* values for an external
# provider, the same pattern as bundled NATS/PostgreSQL. Its database lives on the bundled
# PostgreSQL above (postgresql.enabled must stay true, or postgres.external.* must point
# somewhere real) — core provisions it the same way it provisions its own and every module's.
#
# No Ingress exists yet (a separate, later change) -- this Keycloak is reachable in-cluster
# only, for core/module token verification (oidc.jwksUrl, defaulted automatically below) and
# for booth-admin via port-forward, not yet for a real browser login.
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    # Pinned by digest (ADR 0087/0091's convention), not a floating tag -- confirmed reachable
    # anonymously against quay.io's own registry API, not assumed. Corresponds to the 26.0 tag.
    digest: sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
  resources: {}

postgres:
  # dsn, if set, is used verbatim as booth-core's OWN database connection string instead of
  # core provisioning one (an escape hatch; normally leave empty).
  dsn: ""

  # Used only when postgresql.enabled is false. Leave host empty to turn database
  # provisioning off entirely (modules then get no database from core).
  external:
    host: ""
    port: 5432
    # The account core provisions with. It must be able to create roles and databases and to
    # give a database to the role it created — in practice a superuser, or your provider's
    # equivalent (e.g. rds_superuser).
    adminUser: postgres
    adminDatabase: postgres
    # A Secret holding the admin password (created by you, in this release's namespace).
    existingSecret:
      name: ""
      key: password
    # Use require or stronger against anything that isn't on a trusted network.
    sslmode: require
    # Also stop module roles connecting to the maintenance databases (postgres, template1),
    # which PostgreSQL allows by default and which lets a module list the other databases and
    # roles on the server. Off by default because it changes privileges on a cluster core
    # doesn't own and other tenants may share; the bundled server always has it on.
    restrictMaintenanceAccess: false

# NATS is bundled as a subchart (ADR 0021) — every booth-core install gets an event bus,
# since core is the one mandatory repo. JetStream is enabled for at-least-once delivery
# (ADR 0021's reasoning).
#
# The bus is authenticated (ADR 0049): booth-core generates a NATS operator/account and
# writes the server-side trust config into the ConfigMap `booth-nats-auth` in this
# release's namespace, then mints a scoped credential per module (declared in each
# BoothModule's `events` field). The three settings below are what make the NATS pod
# include that generated file — they are load-bearing, not tuning; removing them leaves
# an unauthenticated bus while core believes it is authenticated.
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 5Gi
    merge:
      # Included from nats.conf. The file is generated by core (internal/natsauth), and
      # its ConfigMap name is a contract with that package.
      $include: ./auth/booth-auth.conf
  podTemplate:
    patch:
      # The NATS pod stays in ContainerCreating until core (which starts independently of
      # NATS) has written this ConfigMap.
      - op: add
        path: /spec/volumes/-
        value:
          name: booth-auth
          configMap:
            name: booth-nats-auth
  container:
    patch:
      - op: add
        path: /volumeMounts/-
        value:
          name: booth-auth
          mountPath: /etc/nats-config/auth
          readOnly: true
  # nats-box ships an unauthenticated CLI context; with auth on it can't connect anyway.
  natsBox:
    enabled: false

# Restricts who can reach the event bus (and the bundled PostgreSQL) at all — defense in depth
# beneath credential auth. NATS admits booth-core, its own cluster traffic, and namespaces core
# has labelled `booth.projectbooth.io/event-bus-client=true`; PostgreSQL admits booth-core and
# namespaces labelled `booth.projectbooth.io/database-client=true`. Core applies each label to
# the namespace of a module that declares `events` / `database`. Enforced only if the cluster's
# CNI implements NetworkPolicy (k3s does; some minimal CNIs don't).
networkPolicy:
  enabled: true

resources: {}

serviceAccount:
  create: true
  name: ""

# RBAC is intentionally broad in v0 (see templates/rbac.yaml's comment) since the
# lifecycle manager (internal/lifecycle) installs arbitrary module charts, which can
# create arbitrary namespaced resources. Tightening this to a real least-privilege policy
# is flagged as follow-up work, not solved here.
rbac:
  create: true
